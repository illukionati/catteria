<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Catteria - Contato</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="https://picsum.photos/seed/gatinhologo/120/120" alt="Logotipo Catteria">
            <div>
                <h1>Catteria</h1>
                <span>Café, carinho e muitos gatos</span>
            </div>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="produtos.html">Produtos</a></li>
            <li><a href="sobre.html">Sobre a Empresa</a></li>
            <li><a href="contato.html" class="nav-ativo">Contato</a></li>
            <li><a href="promocoes.html">Promoções</a></li>
        </ul>
    </nav>

    <main>
        <h2 class="centralizar">Fale Conosco</h2>
        <p class="centralizar">Tem alguma dúvida, sugestão ou quer marcar uma visita? Envie sua mensagem!</p>

        <div class="form-container">
            <form action="#" method="post">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">

                <label for="assunto">Assunto</label>
                <select id="assunto" name="assunto">
                    <option value="duvida">Dúvida</option>
                    <option value="reserva">Reserva de mesa</option>
                    <option value="adocao">Adoção de gatinhos</option>
                    <option value="sugestao">Sugestão</option>
                    <option value="outro">Outro</option>
                </select>

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem aqui..." required></textarea>

                <button type="submit" class="btn">Enviar</button>
            </form>
        </div>
    </main>

    <footer>
        <p>Catteria &copy; 2026 - Todos os direitos reservados</p>
        <p>Rua dos Felinos, 123 - Centro | (13) 99999-0000</p>
    </footer>

</body>
</html>
